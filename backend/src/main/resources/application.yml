spring:
  application:
    name: modoensayo

  datasource:
    url: jdbc:postgresql://localhost:5432/modoensayo
    username: ${DB_USERNAME:modoensayo}
    password: ${DB_PASSWORD:modoensayo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET:modoensayo-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: 86400000

logging:
  level:
    com.modoensayo: INFO
    org.springframework.security: DEBUG
