spring:
  application:
    name: modoensayo

  datasource:
    url: jdbc:postgresql://localhost:5432/modoensayo
    username: ${DB_USERNAME:modoensayo}
    password: ${DB_PASSWORD:modoensayo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET:modoensayo-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: 86400000

storage:
  provider: ${STORAGE_PROVIDER:local}
  upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
  supabase-url: ${SUPABASE_URL:}
  supabase-key: ${SUPABASE_KEY:}
  supabase-bucket: ${SUPABASE_BUCKET:modoensayo}

logging:
  level:
    com.modoensayo: INFO
    org.springframework.security: WARN

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
