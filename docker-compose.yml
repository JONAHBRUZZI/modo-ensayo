services:
  postgres:
    image: postgres:16-alpine
    container_name: modoensayo-db
    restart: always
    environment:
      POSTGRES_DB: modoensayo
      POSTGRES_USER: modoensayo
      POSTGRES_PASSWORD: modoensayo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modoensayo -d modoensayo"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modoensayo-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/modoensayo
      SPRING_DATASOURCE_USERNAME: modoensayo
      SPRING_DATASOURCE_PASSWORD: modoensayo
      JWT_SECRET: 7Dt5OOsrW2R6v2Eyk2rqzQnmXcEe/agy0lTFWbja1ww=
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-TEST-xxxxxxxxxxxxxxxxxxxx}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3001}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-http://localhost}
      STORAGE_PROVIDER: local
      STORAGE_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: modoensayo-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/app/uploads:ro

volumes:
  postgres_data:
  uploads_data:
